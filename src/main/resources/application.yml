spring:
  application:
    name: ai-code-helper
  profiles:
    active: local
server:
  port: 8081
  servlet:
    context-path: /api
logging:
  level:
    root: DEBUG
    org.springframework.boot: DEBUG
    org.springframework.web: DEBUG

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${langchain4j.api-key}
      model-name: deepseek-v4-flash
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${langchain4j.api-key}
      model-name: deepseek-v4-flash
